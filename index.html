<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Долей!">
  <meta name="theme-color" content="#e8eef6">
  <meta name="description" content="Расчёт количества топлива до полного бака">
  <meta name="doley-version" content="43">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png">
  <title>Долей!</title>
  <script>
    (function () {
      try {
        var standalone =
          (window.navigator.standalone === true) ||
          window.matchMedia('(display-mode: standalone)').matches;
        var h = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
        if (standalone) {
          h = Math.max(h, window.screen.height || 0, window.screen.availHeight || 0);
        }
        if (h > 0) document.documentElement.style.setProperty('--frame-h', h + 'px');
      } catch (e) { /* ignore */ }
      try {
        var pref = 'system';
        var raw = localStorage.getItem('doley:v1');
        if (raw) {
          var data = JSON.parse(raw);
          if (data && (data.theme === 'light' || data.theme === 'dark' || data.theme === 'system')) {
            pref = data.theme;
          }
        }
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePref = pref;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#0f1419' : '#e8eef6';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.themePref = 'system';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div id="boot-fail" style="position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:#f4f7fb;color:#152033;font:16px/1.4 system-ui,sans-serif;text-align:center">
    <div style="max-width:320px">
      <p style="font-size:1.2rem;font-weight:600;margin:0 0 8px">«Долей!» не запустилось</p>
      <p style="margin:0 0 16px;color:#6b7a90">Скорее всего, на телефоне смешались старые и новые файлы. Ваши заправки и справочники сохранятся.</p>
      <button type="button" id="boot-fail-reset" style="width:100%;padding:14px;border:0;border-radius:12px;background:#0d9f8f;color:#fff;font:inherit;font-weight:600">Перезапустить начисто</button>
      <p id="boot-fail-detail" style="margin:12px 0 0;font-size:0.75rem;color:#6b7a90;word-break:break-word"></p>
    </div>
  </div>
  <script>
    (function () {
      var APP_FILES = [
        './index.html', './css/app.css', './js/app.js', './js/updates.js', './js/storage.js',
        './js/calc.js', './js/cars.js', './js/dictionaries.js', './js/station-networks.js',
        './js/theme.js', './js/layout.js', './js/loyalty.js', './js/screens/refuel.js',
        './js/screens/history.js', './js/screens/settings.js', './sw.js', './version.json'
      ];
      var BOOT_KEY = 'doley:boot-repair';

      /** Снять сервис-воркер, перекачать файлы мимо HTTP-кэша, очистить кэш и перезагрузить. Данные в localStorage не трогаются. */
      window.__doleyHardReset = async function (nextVersion) {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {}
        try {
          await Promise.all(APP_FILES.map(function (u) {
            return fetch(u, { cache: 'reload' }).catch(function () {});
          }));
        } catch (e) {}
        try {
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        if (nextVersion) localStorage.setItem('doley:app-version', String(nextVersion));
        sessionStorage.removeItem('doley:update-dismissed');
        var url = new URL(window.location.href);
        url.searchParams.set('_', String(Date.now()));
        window.location.replace(url.toString());
      };

      var bootError = '';
      window.addEventListener('error', function (e) {
        if (window.__doleyBooted) return;
        bootError = (e && (e.message || (e.target && (e.target.src || e.target.href)))) || 'ошибка загрузки';
      }, true);

      function bootFailed() {
        if (window.__doleyBooted) return;
        if (!sessionStorage.getItem(BOOT_KEY)) {
          sessionStorage.setItem(BOOT_KEY, '1');
          window.__doleyHardReset();
          return;
        }
        var panel = document.getElementById('boot-fail');
        if (!panel) return;
        document.getElementById('boot-fail-detail').textContent = bootError;
        document.getElementById('boot-fail-reset').onclick = function () { window.__doleyHardReset(); };
        panel.style.display = 'flex';
      }

      setTimeout(function () { if (bootError) bootFailed(); }, 4000);
      setTimeout(bootFailed, 12000);
    })();
  </script>
  <div id="update-banner" class="update-banner" hidden role="status" aria-live="polite">
    <div class="update-banner-inner">
      <p class="update-banner-text" id="update-banner-text">Доступно обновление «Долей!»</p>
      <div class="update-banner-actions">
        <button type="button" class="btn-secondary" id="update-later">Позже</button>
        <button type="button" class="btn-primary" id="update-apply">Обновить</button>
      </div>
    </div>
  </div>
  <div class="app-shell">
    <main class="screens">
      <section id="screen-refuel" class="screen is-active" aria-label="Заправка"></section>
      <section id="screen-history" class="screen" hidden aria-label="История"></section>
      <section id="screen-settings" class="screen" hidden aria-label="Настройки"></section>
    </main>

    <div id="app-dock" class="app-dock" hidden></div>

    <nav class="tab-bar" aria-label="Навигация">
      <button type="button" class="tab-btn active" data-screen="refuel">
        <span class="tab-icon">▣</span>
        <span>Заправка</span>
      </button>
      <button type="button" class="tab-btn" data-screen="history">
        <span class="tab-icon">▤</span>
        <span>История</span>
      </button>
      <button type="button" class="tab-btn" data-screen="settings">
        <span class="tab-icon">⚙</span>
        <span>Настройки</span>
      </button>
    </nav>
  </div>
  <!--
    Inline-проверка обновлений: работает даже если старый SW отдаёт старый js/updates.js.
    index.html грузится network-first, поэтому этот код доезжает до телефона.
  -->
  <script>
    (function () {
      var VERSION_KEY = 'doley:app-version';
      var DISMISS_KEY = 'doley:update-dismissed';
      var CURRENT_CACHE = 'doley-static-v43';
      var remoteVersion = null;
      var remoteCache = null;
      var isStale = false;

      function banner() {
        return document.getElementById('update-banner');
      }

      function showBanner(stale) {
        isStale = !!stale;
        // При устаревшем кэше «Позже» игнорируем — иначе телефон так и остаётся на старом коде
        if (
          !isStale &&
          remoteVersion != null &&
          Number(sessionStorage.getItem(DISMISS_KEY)) === Number(remoteVersion)
        ) {
          return;
        }
        if (isStale) {
          sessionStorage.removeItem(DISMISS_KEY);
        }
        var el = banner();
        if (!el) return;
        var text = el.querySelector('#update-banner-text');
        var later = el.querySelector('#update-later');
        if (text) {
          text.textContent = isStale
            ? 'Установите обновление «Долей!» — сейчас на телефоне старая версия'
            : 'Доступно обновление «Долей!»';
        }
        if (later) later.hidden = !!isStale;
        el.hidden = false;
        window.__doleyUpdateNeeded = true;
      }

      async function forceApply() {
        await window.__doleyHardReset(remoteVersion != null ? remoteVersion : 43);
      }

      function bindButtons() {
        if (window.__doleyUpdateBound) return;
        window.__doleyUpdateBound = true;
        var el = banner();
        if (!el) return;
        var applyBtn = el.querySelector('#update-apply');
        var laterBtn = el.querySelector('#update-later');
        if (applyBtn) {
          applyBtn.addEventListener('click', function () {
            if (typeof window.__doleyApplyUpdate === 'function') {
              window.__doleyApplyUpdate();
            } else {
              forceApply();
            }
          });
        }
        if (laterBtn) {
          laterBtn.addEventListener('click', function () {
            if (isStale) return;
            el.hidden = true;
            if (remoteVersion != null) {
              sessionStorage.setItem(DISMISS_KEY, String(remoteVersion));
            }
          });
        }
      }

      async function hasStaleCaches(currentCache) {
        if (!window.caches) return false;
        var keys = await caches.keys();
        var ours = keys.filter(function (k) { return k.indexOf('doley-static-') === 0; });
        if (!ours.length) return false;
        return ours.some(function (k) { return k !== currentCache; });
      }

      async function check() {
        try {
          var res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return;
          var data = await res.json();
          var remote = Number(data.version);
          if (!isFinite(remote)) return;
          remoteVersion = remote;
          remoteCache = data.cache || CURRENT_CACHE;
          var local = Number(localStorage.getItem(VERSION_KEY) || '0');
          var stale = await hasStaleCaches(remoteCache);
          // meta в HTML новее, чем то, что считает localStorage — тоже сигнал
          var meta = document.querySelector('meta[name="doley-version"]');
          var metaV = meta ? Number(meta.getAttribute('content')) : 0;
          if (metaV > local) stale = true || stale;
          if (remote > local || stale) {
            bindButtons();
            showBanner(stale || remote > local);
          } else if (!localStorage.getItem(VERSION_KEY)) {
            localStorage.setItem(VERSION_KEY, String(remote));
          }
        } catch (e) {}
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          bindButtons();
          check();
        });
      } else {
        bindButtons();
        check();
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
      window.addEventListener('pageshow', check);
      setTimeout(check, 1500);
      setTimeout(check, 4000);
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
